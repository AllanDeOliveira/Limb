# Testes em todo push e pull request.
# Release: suba a versão no package.json, faça commit e crie a tag igual (ex.: v1.5.0):
#   npm version minor && git push --follow-tags
# A tag gera o instalador e o portátil e publica o release no GitHub. Quem instalou recebe a
# atualização sozinho (o app lê o latest.yml do release).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag e package.json precisam ter a mesma versão
        shell: bash
        run: |
          versao=$(node -p "require('./package.json').version")
          [ "v$versao" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} ≠ package.json v$versao"; exit 1; }
      - run: npm ci
      # O instalador e o portátil sobem ao mesmo tempo e cada um criava o próprio release com a mesma tag
      # (um ficava só com o .blockmap). Com o release já criado, os dois sobem para ele.
      - name: Criar o release antes de gerar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes ""
      - name: Gerar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win nsis portable --publish always
