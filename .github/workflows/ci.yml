# Testes em todo push/PR. Numa tag v* (ex.: v1.1.0), gera os .exe do Windows e anexa a um release rascunho.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable nsis --publish never
      - name: Release rascunho com os executáveis
        shell: bash # o PowerShell não expande dist/*.exe para comandos nativos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe --draft --generate-notes
